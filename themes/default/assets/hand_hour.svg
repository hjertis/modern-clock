<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 360" width="40" height="360">
  <defs>
    <!-- Blued Steel Shimmer Gradient -->
    <linearGradient id="bluedSteelHour" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="30%" stop-color="#1e3458" />
      <stop offset="50%" stop-color="#4f7cb5" />
      <stop offset="70%" stop-color="#1e3458" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Brass Bushing Collar -->
    <radialGradient id="brassCollar" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff4c2" />
      <stop offset="45%" stop-color="#d4aa4f" />
      <stop offset="85%" stop-color="#7a5518" />
      <stop offset="100%" stop-color="#3d2707" />
    </radialGradient>

    <filter id="handDrop" x="-30%" y="-15%" width="160%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <g id="hour-hand-art" filter="url(#handDrop)">
    <!-- Main Hand Silhouette & Piercing -->
    <!-- Pivot is at (20, 280) -->
    <!-- Tail (280 to 350) -->
    <path d="
      M 20,280
      L 16,300
      C 13,320 12,335 15,346
      C 18,354 22,354 25,346
      C 28,335 27,320 24,300
      Z
    " fill="url(#bluedSteelHour)" />

    <!-- Stem from pivot (280) up to spade neck (160) -->
    <path d="
      M 16,280
      L 16,160
      C 16,155 14,145 10,135
      C 4,120 4,95 12,75
      C 14,70 17,60 20,20
      C 23,60 26,70 28,75
      C 36,95 36,120 30,135
      C 26,145 24,155 24,160
      L 24,280
      Z
    " fill="url(#bluedSteelHour)" />

    <!-- Pierced Heart / Spade Cutout in upper portion -->
    <path d="
      M 20,48
      C 17,70 11,88 11,105
      C 11,120 16,130 20,138
      C 24,130 29,120 29,105
      C 29,88 23,70 20,48
      Z
    " fill="#000000" opacity="0.35" />
    <path d="
      M 20,60
      C 18,78 14,92 14,106
      C 14,117 18,124 20,130
      C 22,124 26,117 26,106
      C 26,92 22,78 20,60
      Z
      M 20,72
      L 20,122
    " stroke="#0e1726" stroke-width="2.5" fill="none" />

    <!-- Inner Fleur-de-lis trefoil pip -->
    <circle cx="20" cy="102" r="4.5" fill="url(#bluedSteelHour)" stroke="#4f7cb5" stroke-width="1.2" />

    <!-- Center Spine Highlight -->
    <line x1="20" y1="160" x2="20" y2="275" stroke="#4f7cb5" stroke-width="1.8" opacity="0.8" />

    <!-- Pivot Boss / Collar Ring (x=20, y=280) -->
    <circle cx="20" cy="280" r="14" fill="url(#bluedSteelHour)" />
    <circle cx="20" cy="280" r="9" fill="url(#brassCollar)" />
    <circle cx="20" cy="280" r="4" fill="#0d131e" />
  </g>
</svg>
