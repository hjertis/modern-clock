<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Digital Grandfather Clock</title>
    <link rel="icon" type="image/svg+xml" href="/themes/default/assets/cap.svg" />
  </head>
  <body>
    <!-- Floating Top-Left Control Pills -->
    <div id="top-control-pills">
      <button id="hud-toggle-pill" title="Toggle Developer HUD (or press H)">
        <span>⚙️ Calibration HUD (H)</span>
      </button>
      <button id="theme-toggle-pill" title="Switch Theme Architecture (or press T)">
        <span id="theme-pill-label">⚡ PCB-2049 / Silicon (T)</span>
      </button>
    </div>

    <!-- Master Viewport Container with Containment Scaling -->
    <div id="clock-container">
      <div id="clock-stage" data-theme="pcb_2049">
        <!-- Primary Hardware-Accelerated Pluggable Theme Canvas -->
        <canvas id="clock-canvas" class="clock-layer" width="1080" height="1920"></canvas>

        <!-- Legacy DOM Layers (retained for ThemeLoader compatibility) -->
        <img id="clock-bg" class="clock-layer legacy-dom-layer" alt="Clock Case Background" draggable="false" />
        <img id="clock-pendulum" class="clock-layer legacy-dom-layer" alt="Clock Pendulum" draggable="false" />

        <!-- Dynamic Notification / Glance Chamber -->
        <div id="notification-zone" class="clock-layer"></div>

        <!-- Legacy Dial & Hand DOM Layers -->
        <img id="clock-dial" class="clock-layer legacy-dom-layer" alt="Clock Dial Face" draggable="false" />
        <img id="hand-hour" class="clock-layer clock-hand legacy-dom-layer" alt="Hour Hand" draggable="false" />
        <img id="hand-minute" class="clock-layer clock-hand legacy-dom-layer" alt="Minute Hand" draggable="false" />
        <img id="hand-second" class="clock-layer clock-hand legacy-dom-layer" alt="Second Hand" draggable="false" />
        <img id="hand-cap" class="clock-layer legacy-dom-layer" alt="Center Pinion Cap" draggable="false" />

        <!-- Debug Calibration Crosshairs -->
        <div id="debug-crosshairs" class="clock-layer"></div>
      </div>
    </div>

    <!-- Application Entry Point -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
