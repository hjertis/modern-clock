services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: modern-clock-backend
    restart: unless-stopped
    ports:
      - 8088:8088
    environment:
      - PORT=8088
      - MQTT_BROKER_HOST=192.168.0.69
      - MQTT_BROKER_PORT=1883
      - RUST_LOG=info
    # If the Dockerfile relies on volume mounts for hot-reloading:
    volumes:
      - ./backend:/app
      - /app/target
networks: {}
