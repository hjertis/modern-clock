<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <defs>
    <!-- Brass Bezel Gradients -->
    <radialGradient id="brassBezel" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff5cc" />
      <stop offset="25%" stop-color="#d8ab55" />
      <stop offset="60%" stop-color="#936d23" />
      <stop offset="85%" stop-color="#5a4112" />
      <stop offset="100%" stop-color="#332408" />
    </radialGradient>

    <radialGradient id="brassRim" cx="50%" cy="50%" r="50%">
      <stop offset="88%" stop-color="#72551e" />
      <stop offset="92%" stop-color="#f5e1a4" />
      <stop offset="96%" stop-color="#987328" />
      <stop offset="100%" stop-color="#46330e" />
    </radialGradient>

    <!-- Enamel Porcelain Face -->
    <radialGradient id="porcelainFace" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#faf5e8" />
      <stop offset="85%" stop-color="#eee3cb" />
      <stop offset="100%" stop-color="#d9caa8" />
    </radialGradient>

    <!-- Center Guilloché Disc -->
    <radialGradient id="centerDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdfbf5" />
      <stop offset="60%" stop-color="#f1e7d2" />
      <stop offset="95%" stop-color="#d4c29c" />
      <stop offset="100%" stop-color="#8c7348" />
    </radialGradient>

    <filter id="dialShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dial Group -->
  <g id="dial-face" filter="url(#dialShadow)">
    <!-- Outer Heavy Brass Bezel -->
    <circle cx="450" cy="450" r="446" fill="url(#brassBezel)" />
    <circle cx="450" cy="450" r="428" fill="url(#brassRim)" />
    <circle cx="450" cy="450" r="422" stroke="#2a1e0a" stroke-width="2.5" fill="none" />

    <!-- Ivory Porcelain Chapter Ring -->
    <circle cx="450" cy="450" r="420" fill="url(#porcelainFace)" />

    <!-- Outer Minute Railway Track -->
    <circle cx="450" cy="450" r="408" stroke="#1d160c" stroke-width="2.5" fill="none" />
    <circle cx="450" cy="450" r="392" stroke="#1d160c" stroke-width="1.8" fill="none" />

    <!-- 60-Minute Radial Ticks -->
    <g id="minute-ticks" stroke="#1d160c">
      <!-- 60 ticks generated via rotated lines centered at 450,450 -->
      <!-- We write clean radial lines for all 60 minutes -->
      <!-- Every 5 min: bolder line from 388 to 412 -->
      <!-- Every 1 min: fine line from 392 to 408 -->
      <!-- 0 / 60 -->
      <line x1="450" y1="38" x2="450" y2="62" stroke-width="4" />
      <!-- 5 min markers with diamond pips and numbers -->
      <!-- Hour / 5 min markers (30 deg intervals) -->
      <g stroke-width="3.5">
        <line x1="450" y1="38" x2="450" y2="62" transform="rotate(30 450 450)" />
        <line x1="450" y1="38" x2="450" y2="62" transform="rotate(60 450 450)" />
        <line x1="450" y1="38" x2="450" y2="62" transform="rotate(90 450 450)" />
        <line x1="450" y1="38" x2="450" y2="62" transform="rotate(120 450 450)" />
        <line x1="450" y1="38" x2="450" y2="62" transform="rotate(150 450 450)" />
        <line x1="450" y1="38" x2="450" y2="62" transform="rotate(180 450 450)" />
        <line x1="450" y1="38" x2="450" y2="62" transform="rotate(210 450 450)" />
        <line x1="450" y1="38" x2="450" y2="62" transform="rotate(240 450 450)" />
        <line x1="450" y1="38" x2="450" y2="62" transform="rotate(270 450 450)" />
        <line x1="450" y1="38" x2="450" y2="62" transform="rotate(300 450 450)" />
        <line x1="450" y1="38" x2="450" y2="62" transform="rotate(330 450 450)" />
      </g>

      <!-- 1 min fine ticks (every 6 deg, skipping multiples of 30) -->
      <g stroke-width="1.6" opacity="0.85">
        <!-- Q1 -->
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(6 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(12 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(18 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(24 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(36 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(42 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(48 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(54 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(66 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(72 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(78 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(84 450 450)" />
        <!-- Q2 -->
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(96 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(102 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(108 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(114 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(126 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(132 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(138 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(144 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(156 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(162 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(168 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(174 450 450)" />
        <!-- Q3 -->
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(186 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(192 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(198 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(204 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(216 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(222 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(228 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(234 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(246 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(252 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(258 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(264 450 450)" />
        <!-- Q4 -->
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(276 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(282 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(288 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(294 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(306 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(312 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(318 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(324 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(336 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(342 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(348 450 450)" />
        <line x1="450" y1="42" x2="450" y2="58" transform="rotate(354 450 450)" />
      </g>
    </g>

    <!-- Outer 5-Minute Arabic Numbers -->
    <g font-family="'Georgia', serif" font-size="15" font-weight="bold" fill="#322212" text-anchor="middle" dominant-baseline="central">
      <text x="450" y="24">60</text>
      <text x="663" y="81">05</text>
      <text x="819" y="237">10</text>
      <text x="876" y="450">15</text>
      <text x="819" y="663">20</text>
      <text x="663" y="819">25</text>
      <text x="450" y="876">30</text>
      <text x="237" y="819">35</text>
      <text x="81" y="663">40</text>
      <text x="24" y="450">45</text>
      <text x="81" y="237">50</text>
      <text x="237" y="81">55</text>
    </g>

    <!-- Roman Numerals (Traditional Grandfather Clock Dial) -->
    <!-- Authentic clockmaker: IIII for 4 -->
    <g font-family="'Times New Roman', 'Didot', 'Bodoni MT', serif" font-size="64" font-weight="bold" fill="#150f09" text-anchor="middle" dominant-baseline="central">
      <!-- XII (12) -->
      <text x="450" y="145">XII</text>
      <!-- I (1) -->
      <text x="605" y="185">I</text>
      <!-- II (2) -->
      <text x="715" y="295">II</text>
      <!-- III (3) -->
      <text x="755" y="450">III</text>
      <!-- IIII (4) -->
      <text x="715" y="605">IIII</text>
      <!-- V (5) -->
      <text x="605" y="715">V</text>
      <!-- VI (6) -->
      <text x="450" y="755">VI</text>
      <!-- VII (7) -->
      <text x="295" y="715">VII</text>
      <!-- VIII (8) -->
      <text x="185" y="605">VIII</text>
      <!-- IX (9) -->
      <text x="145" y="450">IX</text>
      <!-- X (10) -->
      <text x="185" y="295">X</text>
      <!-- XI (11) -->
      <text x="295" y="185">XI</text>
    </g>

    <!-- Inner Chapter Ring Inlay -->
    <circle cx="450" cy="450" r="236" stroke="#1d160c" stroke-width="2.5" fill="none" />
    <circle cx="450" cy="450" r="230" stroke="url(#brassRim)" stroke-width="3" fill="none" />

    <!-- Center Guilloché Disc -->
    <circle cx="450" cy="450" r="226" fill="url(#centerDisc)" />

    <!-- Subtle Sunburst Radial Lines on center disc -->
    <g stroke="rgba(120, 90, 40, 0.16)" stroke-width="1.2">
      <!-- 24 rays -->
      <line x1="450" y1="230" x2="450" y2="670" />
      <line x1="230" y1="450" x2="670" y2="450" />
      <line x1="450" y1="230" x2="450" y2="670" transform="rotate(15 450 450)" />
      <line x1="450" y1="230" x2="450" y2="670" transform="rotate(30 450 450)" />
      <line x1="450" y1="230" x2="450" y2="670" transform="rotate(45 450 450)" />
      <line x1="450" y1="230" x2="450" y2="670" transform="rotate(60 450 450)" />
      <line x1="450" y1="230" x2="450" y2="670" transform="rotate(75 450 450)" />
      <line x1="450" y1="230" x2="450" y2="670" transform="rotate(105 450 450)" />
      <line x1="450" y1="230" x2="450" y2="670" transform="rotate(120 450 450)" />
      <line x1="450" y1="230" x2="450" y2="670" transform="rotate(135 450 450)" />
      <line x1="450" y1="230" x2="450" y2="670" transform="rotate(150 450 450)" />
      <line x1="450" y1="230" x2="450" y2="670" transform="rotate(165 450 450)" />
    </g>

    <!-- Clockmaker Inscription -->
    <text x="450" y="360" font-family="'Times New Roman', serif" font-size="20" font-style="italic" letter-spacing="4" fill="#3a2a16" text-anchor="middle">TEMPO LIBERO</text>
    <text x="450" y="382" font-family="'Times New Roman', serif" font-size="12" letter-spacing="3" fill="#665033" text-anchor="middle">VIENNA REGULATOR</text>

    <!-- Traditional Dual Winding Arbors (Keyholes) at 4:30 and 7:30 -->
    <!-- Left Winding Arbor -->
    <g transform="translate(365, 520)">
      <circle cx="0" cy="0" r="14" fill="url(#brassBezel)" stroke="#221608" stroke-width="1.5" />
      <rect x="-4" y="-4" width="8" height="8" rx="1" fill="#120c06" />
    </g>
    <!-- Right Winding Arbor -->
    <g transform="translate(535, 520)">
      <circle cx="0" cy="0" r="14" fill="url(#brassBezel)" stroke="#221608" stroke-width="1.5" />
      <rect x="-4" y="-4" width="8" height="8" rx="1" fill="#120c06" />
    </g>

    <!-- Center Arbor Hole -->
    <circle cx="450" cy="450" r="16" fill="#120a05" />
    <circle cx="450" cy="450" r="12" stroke="url(#brassRim)" stroke-width="2.5" fill="none" />
  </g>
</svg>

