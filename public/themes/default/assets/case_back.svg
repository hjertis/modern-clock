<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Wood grain linear gradients -->
    <linearGradient id="caseDarkWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#140b07" />
      <stop offset="6%" stop-color="#2a170f" />
      <stop offset="15%" stop-color="#3d2116" />
      <stop offset="50%" stop-color="#4d2b1d" />
      <stop offset="85%" stop-color="#3d2116" />
      <stop offset="94%" stop-color="#2a170f" />
      <stop offset="100%" stop-color="#140b07" />
    </linearGradient>

    <linearGradient id="pilasterWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d100b" />
      <stop offset="25%" stop-color="#3d2216" />
      <stop offset="50%" stop-color="#643825" />
      <stop offset="75%" stop-color="#3d2216" />
      <stop offset="100%" stop-color="#180d08" />
    </linearGradient>

    <linearGradient id="innerChamber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0503" />
      <stop offset="40%" stop-color="#170c08" />
      <stop offset="70%" stop-color="#24130c" />
      <stop offset="100%" stop-color="#0e0704" />
    </linearGradient>

    <!-- Brass gradients -->
    <linearGradient id="brassGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a4214" />
      <stop offset="20%" stop-color="#c59f4e" />
      <stop offset="45%" stop-color="#fcedb3" />
      <stop offset="65%" stop-color="#d4aa55" />
      <stop offset="85%" stop-color="#8a6723" />
      <stop offset="100%" stop-color="#4d370f" />
    </linearGradient>

    <linearGradient id="brassGradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5a1f" />
      <stop offset="25%" stop-color="#d6af5d" />
      <stop offset="50%" stop-color="#faecc0" />
      <stop offset="75%" stop-color="#c19747" />
      <stop offset="100%" stop-color="#553c12" />
    </linearGradient>

    <!-- Glass edge reflection -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="35%" stop-color="rgba(255,255,255,0.02)" />
      <stop offset="65%" stop-color="rgba(255,255,255,0.0)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)" />
      <stop offset="70%" stop-color="rgba(0,0,0,0.4)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.85)" />
    </radialGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Background Base Case -->
  <rect x="0" y="0" width="1080" height="1920" fill="url(#caseDarkWood)" />

  <!-- Classical Arched Hood / Pediment -->
  <path d="M 90,140 Q 540,10 990,140 L 990,200 L 90,200 Z" fill="url(#pilasterWood)" />
  <path d="M 120,150 Q 540,30 960,150" stroke="url(#brassGradH)" stroke-width="6" fill="none" />
  <!-- Center Carved Finial Base -->
  <rect x="510" y="15" width="60" height="25" rx="4" fill="url(#brassGradH)" />
  <ellipse cx="540" cy="12" rx="16" ry="12" fill="url(#brassGradV)" />

  <!-- Side Fluted Columns (Left & Right) -->
  <g id="columns">
    <!-- Left Column -->
    <rect x="30" y="190" width="70" height="1620" fill="url(#pilasterWood)" />
    <line x1="50" y1="210" x2="50" y2="1790" stroke="#160c07" stroke-width="4" />
    <line x1="52" y1="210" x2="52" y2="1790" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    <line x1="70" y1="210" x2="70" y2="1790" stroke="#160c07" stroke-width="4" />
    <line x1="72" y1="210" x2="72" y2="1790" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    <rect x="24" y="190" width="82" height="22" rx="3" fill="url(#brassGradH)" />
    <rect x="24" y="980" width="82" height="18" rx="2" fill="url(#brassGradH)" />
    <rect x="24" y="1800" width="82" height="26" rx="4" fill="url(#brassGradH)" />

    <!-- Right Column -->
    <rect x="980" y="190" width="70" height="1620" fill="url(#pilasterWood)" />
    <line x1="1000" y1="210" x2="1000" y2="1790" stroke="#160c07" stroke-width="4" />
    <line x1="1002" y1="210" x2="1002" y2="1790" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    <line x1="1020" y1="210" x2="1020" y2="1790" stroke="#160c07" stroke-width="4" />
    <line x1="1022" y1="210" x2="1022" y2="1790" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    <rect x="974" y="190" width="82" height="22" rx="3" fill="url(#brassGradH)" />
    <rect x="974" y="980" width="82" height="18" rx="2" fill="url(#brassGradH)" />
    <rect x="974" y="1800" width="82" height="26" rx="4" fill="url(#brassGradH)" />
  </g>

  <!-- Dial Hood Chamber Aperture (Round Hood Backing) -->
  <circle cx="540" cy="540" r="460" fill="#0d0705" />
  <circle cx="540" cy="540" r="455" stroke="url(#brassGradH)" stroke-width="4" fill="none" opacity="0.6" />

  <!-- Waist Molding Divider -->
  <rect x="100" y="990" width="880" height="24" fill="url(#brassGradH)" filter="url(#softShadow)" />
  <rect x="110" y="1014" width="860" height="10" fill="#1b0f0a" />

  <!-- Pendulum Trunk Chamber -->
  <g id="pendulum-chamber">
    <!-- Recessed back panel -->
    <rect x="130" y="1030" width="820" height="740" rx="8" fill="url(#innerChamber)" />
    <!-- Vertical wood plank grooves -->
    <g stroke="#090503" stroke-width="3" opacity="0.7">
      <line x1="250" y1="1030" x2="250" y2="1770" />
      <line x1="370" y1="1030" x2="370" y2="1770" />
      <line x1="490" y1="1030" x2="490" y2="1770" />
      <line x1="590" y1="1030" x2="590" y2="1770" />
      <line x1="710" y1="1030" x2="710" y2="1770" />
      <line x1="830" y1="1030" x2="830" y2="1770" />
    </g>

    <!-- Classical Brass Beat Scale / Arc Plate at bottom of pendulum swing -->
    <g id="beat-scale" transform="translate(540, 1540)">
      <!-- Curved brass plate -->
      <path d="M -260,0 Q 0,40 260,0 L 260,32 Q 0,72 -260,32 Z" fill="url(#brassGradH)" stroke="#2b1a08" stroke-width="1.5" />
      <!-- Scale arc ticks -->
      <path d="M -240,12 Q 0,50 240,12" stroke="#2a1705" stroke-width="2" fill="none" />
      <!-- Center Zero Pip -->
      <line x1="0" y1="16" x2="0" y2="44" stroke="#1b0f02" stroke-width="3" />
      <circle cx="0" cy="48" r="3" fill="#1b0f02" />
      <!-- Left & Right Ticks (-6 to +6 degrees) -->
      <line x1="-200" y1="0" x2="-200" y2="24" stroke="#221203" stroke-width="2.5" />
      <line x1="-150" y1="7" x2="-150" y2="27" stroke="#221203" stroke-width="1.8" />
      <line x1="-100" y1="14" x2="-100" y2="33" stroke="#221203" stroke-width="2" />
      <line x1="-50" y1="18" x2="-50" y2="35" stroke="#221203" stroke-width="1.8" />
      <line x1="50" y1="18" x2="50" y2="35" stroke="#221203" stroke-width="1.8" />
      <line x1="100" y1="14" x2="100" y2="33" stroke="#221203" stroke-width="2" />
      <line x1="150" y1="7" x2="150" y2="27" stroke="#221203" stroke-width="1.8" />
      <line x1="200" y1="0" x2="200" y2="24" stroke="#221203" stroke-width="2.5" />
      <text x="0" y="62" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#2d1d07" text-anchor="middle">0</text>
      <text x="-200" y="38" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2d1d07" text-anchor="middle">6°</text>
      <text x="200" y="38" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2d1d07" text-anchor="middle">6°</text>
    </g>

    <!-- Trunk Beveled Door Frame -->
    <rect x="120" y="1020" width="840" height="760" rx="10" fill="none" stroke="url(#brassGradV)" stroke-width="6" />
    <rect x="126" y="1026" width="828" height="748" rx="7" fill="none" stroke="#000000" stroke-width="8" opacity="0.65" />
    <!-- Subtle glass sheen -->
    <rect x="130" y="1030" width="820" height="740" fill="url(#glassReflection)" pointer-events="none" />
  </g>

  <!-- Bottom Pedestal Base Plinth -->
  <rect x="60" y="1810" width="960" height="90" fill="url(#pilasterWood)" filter="url(#softShadow)" />
  <rect x="80" y="1820" width="920" height="12" fill="url(#brassGradH)" />
  <rect x="40" y="1890" width="1000" height="30" fill="#130a06" />

  <!-- Overall Ambient Vignette -->
  <rect x="0" y="0" width="1080" height="1920" fill="url(#vignette)" pointer-events="none" />
</svg>

