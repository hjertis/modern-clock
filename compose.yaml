services:
  grandfather-clock:
    build: .
    image: cirqit-labs/grandfather-clock:1.0.0
    container_name: grandfather-clock
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - TZ=Europe/Copenhagen
      - PORT=8088
      - MQTT_HOST=192.168.0.69
      - MQTT_PORT=1883
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASS=${MQTT_PASS:-}

